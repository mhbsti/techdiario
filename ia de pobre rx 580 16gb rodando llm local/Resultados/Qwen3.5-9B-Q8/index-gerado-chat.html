<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 100%;
            max-width: 600px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .counter {
            text-align: center;
            font-size: 18px;
            color: #555;
            margin-bottom: 20px;
            font-weight: bold;
            background-color: #e8f4fd;
            padding: 10px;
            border-radius: 5px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #taskInput {
            flex: 1;
            padding: 12px 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 5px;
            outline: none;
            transition: border-color 0.3s;
        }

        #taskInput:focus {
            border-color: #4a90d9;
        }

        #addBtn, #clearBtn {
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #addBtn {
            background-color: #4a90d9;
            color: white;
        }

        #addBtn:hover {
            background-color: #357abd;
        }

        #clearBtn {
            background-color: #dc3545;
            color: white;
        }

        #clearBtn:hover {
            background-color: #c82333;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            background-color: #f8f9fa;
            margin-bottom: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
            user-select: none;
        }

        li:hover {
            background-color: #e9ecef;
        }

        li.completed {
            text-decoration: line-through;
            color: #888;
            background-color: #f0f0f0;
        }

        .delete-btn {
            background: none;
            border: none;
            font-size: 20px;
            color: #dc3545;
            cursor: pointer;
            padding: 0 10px;
            margin-left: 10px;
            transition: color 0.2s;
        }

        .delete-btn:hover {
            color: #a71d2a;
        }

        .task-text {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Task Manager</h1>
        
        <div class="counter" id="counter">
            Active: 0 | Completed: 0 | Total: 0
        </div>

        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Enter a new task...">
            <button id="addBtn">Add Task</button>
            <button id="clearBtn">Clear All</button>
        </div>

        <ul id="taskList"></ul>
    </div>

    <script>
        // DOM Elements
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const clearBtn = document.getElementById('clearBtn');
        const taskList = document.getElementById('taskList');
        const counter = document.getElementById('counter');

        // Load tasks from localStorage
        let tasks = JSON.parse(localStorage.getItem('tasks')) || getInitialTasks();

        // Initial hardcoded tasks
        function getInitialTasks() {
            return [
                { id: 1, text: 'Buy groceries', completed: false },
                { id: 2, text: 'Walk the dog', completed: false },
                { id: 3, text: 'Do laundry', completed: false },
                { id: 4, text: 'Read a book', completed: false },
                { id: 5, text: 'Water plants', completed: false }
            ];
        }

        // Save tasks to localStorage
        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
            updateCounter();
        }

        // Render tasks
        function renderTasks() {
            taskList.innerHTML = '';
            
            tasks.forEach(task => {
                const li = document.createElement('li');
                li.className = task.completed ? 'completed' : '';
                li.dataset.id = task.id;

                const span = document.createElement('span');
                span.className = 'task-text';
                span.textContent = task.text;

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.innerHTML = '✕';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteTask(task.id);
                };

                li.appendChild(span);
                li.appendChild(deleteBtn);
                taskList.appendChild(li);
            });

            updateCounter();
        }

        // Add a new task
        function addTask() {
            const text = taskInput.value.trim();
            if (text) {
                const newTask = {
                    id: Date.now(),
                    text: text,
                    completed: false
                };
                tasks.push(newTask);
                taskInput.value = '';
                saveTasks();
                renderTasks();
            }
        }

        // Delete a task
        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            saveTasks();
            renderTasks();
        }

        // Toggle task completion
        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                renderTasks();
            }
        }

        // Update counter display
        function updateCounter() {
            const active = tasks.filter(t => !t.completed).length;
            const completed = tasks.filter(t => t.completed).length;
            const total = tasks.length;
            counter.textContent = `Active: ${active} | Completed: ${completed} | Total: ${total}`;
        }

        // Clear all tasks
        function clearAll() {
            tasks = [];
            saveTasks();
            renderTasks();
        }

        // Event Listeners
        addBtn.addEventListener('click', addTask);
        
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addTask();
            }
        });
        
        clearBtn.addEventListener('click', clearAll);
        
        // Initialize
        renderTasks();
    </script>
</body>
</html>
