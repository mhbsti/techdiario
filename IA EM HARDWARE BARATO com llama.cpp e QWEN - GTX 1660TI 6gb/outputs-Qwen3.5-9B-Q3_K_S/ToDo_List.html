<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <style>
        :root { --bg: #f4f4f9; --text: #333; --primary: #4a90e2; --danger: #e74c3c; --gray: #95a5a6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .stats { font-size: 1.2rem; margin-bottom: 20px; font-weight: 600; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { padding: 10px; border: 1px solid #ccc; border-radius: 4px; flex: 1; font-size: 1rem; }
        button { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
        .btn-add { background: var(--primary); color: white; }
        .btn-clear { background: var(--danger); color: white; }
        ul { list-style: none; padding: 0; width: 100%; max-width: 600px; }
        li { background: white; margin-bottom: 10px; padding: 15px; border-radius: 4px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        li.completed span { text-decoration: line-through; color: var(--gray); }
        .task-content { flex: 1; margin-right: 10px; }
        .btn-toggle { background: none; border: 1px solid #ddd; color: var(--text); padding: 5px; border-radius: 4px; }
        .btn-delete { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 1.2rem; }
        .btn-delete:hover { color: #c0392b; }
        .btn-toggle:hover { background: #eee; }
    </style>
</head>
<body>
    <h1>Task Manager</h1>
    <div class="stats" id="stats">Active: 0 | Completed: 0 | Total: 0</div>
    <div class="controls">
        <input type="text" id="taskInput" placeholder="Enter a new task...">
        <button class="btn-add" id="addBtn">Add Task</button>
        <button class="btn-clear" id="clearBtn">Clear All</button>
    </div>
    <ul id="taskList"></ul>

    <script>
        const STORAGE_KEY = 'taskManagerData';
        let tasks = [
            { id: 1, text: 'Buy groceries', completed: false },
            { id: 2, text: 'Walk the dog', completed: false },
            { id: 3, text: 'Pay bills', completed: false },
            { id: 4, text: 'Read a book', completed: false },
            { id: 5, text: 'Exercise', completed: false }
        ];

        const taskList = document.getElementById('taskList');
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const clearBtn = document.getElementById('clearBtn');
        const statsEl = document.getElementById('stats');

        function loadTasks() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                tasks = JSON.parse(stored);
            }
            render();
        }

        function saveTasks() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        }

        function render() {
            taskList.innerHTML = '';
            tasks.forEach(task => {
                const li = document.createElement('li');
                if (task.completed) li.classList.add('completed');
                
                const span = document.createElement('span');
                span.className = 'task-content';
                span.textContent = task.text;
                
                const toggleBtn = document.createElement('button');
                toggleBtn.className = 'btn-toggle';
                toggleBtn.textContent = task.completed ? 'Undo' : 'Done';
                toggleBtn.onclick = () => toggleTask(task.id);
                
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'btn-delete';
                deleteBtn.textContent = '✕';
                deleteBtn.onclick = () => deleteTask(task.id);

                li.appendChild(span);
                li.appendChild(toggleBtn);
                li.appendChild(deleteBtn);
                taskList.appendChild(li);
            });
            updateStats();
        }

        function updateStats() {
            const active = tasks.filter(t => !t.completed).length;
            const completed = tasks.filter(t => t.completed).length;
            const total = tasks.length;
            statsEl.textContent = `Active: ${active} | Completed: ${completed} | Total: ${total}`;
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                render();
            }
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            render();
        }

        function addTask() {
            const text = taskInput.value.trim();
            if (!text) return;
            const newId = Date.now();
            tasks.push({ id: newId, text: text, completed: false });
            saveTasks();
            render();
            taskInput.value = '';
            taskInput.focus();
        }

        function clearAll() {
            tasks = [];
            saveTasks();
            render();
        }

        addBtn.addEventListener('click', addTask);
        clearBtn.addEventListener('click', clearAll);
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });

        loadTasks();
    </script>
</body>
</html>
